name: Coverage

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # Branch instrumentation uses `-Z coverage-options=branch`. This must
      # override the repository's stable rust-toolchain.toml for every step,
      # including the instrumented maturin build.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust for branch coverage
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Clean previous coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Collect scalar coverage
        run: cargo llvm-cov --locked --branch --no-report -p openferric --no-default-features

      - name: Collect SIMD and parallel coverage
        run: cargo llvm-cov --locked --branch --no-report -p openferric --no-default-features --features parallel,simd

      - name: Collect JIT coverage
        run: cargo llvm-cov --locked --branch --no-report -p openferric --no-default-features --features jit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python coverage dependencies
        run: pip install maturin pytest numpy

      - name: Collect Rust coverage through Python bindings
        shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          export RUSTFLAGS="${RUSTFLAGS:-} -Z coverage-options=branch"
          maturin build --locked -m python/Cargo.toml
          pip install --force-reinstall target/wheels/*.whl
          pytest python/tests -q

      - name: Generate merged coverage report
        run: cargo llvm-cov report --branch --codecov --output-path codecov.json --ignore-filename-regex '/(tests|benches|examples|src/bin)/'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
