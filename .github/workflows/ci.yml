name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all --check

  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
        env:
          RUSTFLAGS: ""

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check python/ examples/

      - name: Ruff format check
        run: ruff format --check python/ examples/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --features accelerated-native
        env:
          RUSTFLAGS: ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build Python wheel
        run: maturin build --locked --release -m python/Cargo.toml
        env:
          RUSTFLAGS: ""

      - name: Install wheel
        run: pip install target/wheels/*.whl

      - name: Run Python tests
        run: pytest python/tests/ -v

  arm64-simd:
    name: ARM64 SIMD
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Run full ARM64 suite with NEON and Rayon
        run: cargo test --locked -p openferric --features parallel,simd
        env:
          RUSTFLAGS: ""

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned nightly for threaded WASM
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-11-15
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build portable WASM
        run: ./scripts/build-wasm.sh baseline

      - name: Build SIMD128 WASM
        run: ./scripts/build-wasm.sh simd

      - name: Build threaded WASM
        run: ./scripts/build-wasm.sh threads

      - name: Test WASM under Node
        run: rustup run 1.94.0 wasm-pack test --node wasm --locked

      - name: Test SIMD128 WASM under Node
        run: |
          rustup run 1.94.0 env \
            RUSTFLAGS='--cfg getrandom_backend="wasm_js" -C target-feature=+simd128' \
            wasm-pack test --node wasm --locked --features simd

      - name: Smoke-test threaded WASM in headless Chrome
        run: node scripts/test-wasm-threads.mjs

      - name: Check WASM WebGPU build
        run: rustup run 1.94.0 cargo check --locked -p openferric-wasm --target wasm32-unknown-unknown --features gpu

      - name: Check portable WASM size budget
        run: test "$(wc -c < www/pkg/openferric_wasm_bg.wasm)" -le 1200000

  core-feature-matrix:
    name: Core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-default
            os: ubuntu-latest
            command: test
            args: --no-default-features
          - name: linux-parallel
            os: ubuntu-latest
            command: check
            args: --no-default-features --features parallel
          - name: linux-simd
            os: ubuntu-latest
            command: check
            args: --no-default-features --features simd
          - name: linux-all
            os: ubuntu-latest
            command: test
            args: --all-features
          - name: windows-accelerated
            os: windows-latest
            command: test
            args: --no-default-features --features parallel,simd,jit
          - name: macos-accelerated
            os: macos-latest
            command: test
            args: --no-default-features --features parallel,simd,jit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: Run feature and platform combination
        run: cargo ${{ matrix.command }} --locked -p openferric ${{ matrix.args }}
        env:
          RUSTFLAGS: ""

  msrv:
    name: MSRV 1.92
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2

      - name: Check every core feature at MSRV
        run: cargo check --locked -p openferric --all-features
        env:
          RUSTFLAGS: ""
