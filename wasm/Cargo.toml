[package]
name = "openferric-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu = ["openferric/gpu"]
simd = ["openferric/simd"]
threads = ["openferric/parallel", "dep:wasm-bindgen-rayon"]
browser-tests = []

[dependencies]
openferric = { path = ".." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
wasmparser = "0.244"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    # These flags let the optimizer accept the opt-in packages. They do not
    # enable SIMD or atomics in the portable build; rustc's target features
    # determine which instructions are present in each input module.
    "--enable-simd",
    "--enable-threads",
]
